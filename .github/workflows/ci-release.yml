name: Test and build HarmonyX+

on:
  push:
    branches: ['**']
  pull_request:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      artifact: ${{ steps.package.outputs.artifact }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Run regression tests
        run: |
          bash scripts/build-hap.sh --prepare
          npm install --prefix "$RUNNER_TEMP/harmonyx-test-tools" --no-package-lock --no-save typescript@5.9.3
          export HARMONYX_TYPESCRIPT="$RUNNER_TEMP/harmonyx-test-tools/node_modules/typescript/lib/typescript.js"
          node --test tests/*.test.cjs
          npm ci --prefix server
          node --test server/test/*.test.mjs
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '17'
      - name: Install SDK runtime dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libgl1 libxrender1 libxtst6 libxi6
      - name: Set up HarmonyOS API 26
        uses: ErBWs/setup-ohos@4dbb63025116eb6165ceac58a4bf47cbdc5ac721 # v2
        with:
          version: 26.0.0.821
          cache: false
      - name: Build and validate unsigned HAP
        id: package
        run: bash scripts/build-hap.sh
      - name: Save HAP, ZIP and checksums
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.package.outputs.artifact }}
          path: build/release/
          if-no-files-found: error

  upload-release:
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.build.outputs.artifact }}
          path: release-assets
      - name: Verify and upload release assets
        working-directory: release-assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          sha256sum --check SHA256SUMS
          gh release upload --clobber -- "$RELEASE_TAG" ./*.hap ./*.zip SHA256SUMS
