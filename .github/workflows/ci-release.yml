name: Test and build HarmonyX

on:
  push:
    branches: ['**']
  pull_request:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Run regression tests
        run: |
          bash scripts/build-hap.sh --prepare
          npm install --prefix "$RUNNER_TEMP/harmonyx-test-tools" --no-package-lock --no-save typescript@5.9.3
          export HARMONYX_TYPESCRIPT="$RUNNER_TEMP/harmonyx-test-tools/node_modules/typescript/lib/typescript.js"
          node --test tests/*.test.cjs
          npm ci --prefix server
          node --test server/test/*.test.mjs
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install SDK runtime dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libgl1 libxrender1 libxtst6 libxi6
      - name: Set up HarmonyOS API 26
        uses: ErBWs/setup-ohos@4dbb63025116eb6165ceac58a4bf47cbdc5ac721 # v2
        with:
          version: 26.0.0.821
          cache: false
      - name: Build and validate unsigned HAP
        run: bash scripts/build-hap.sh
      - name: Save HAP and checksum
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: harmonyx-hap
          path: build/release/
          if-no-files-found: error

  upload-release:
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: harmonyx-hap
          path: release-assets
      - name: Verify and upload release assets
        working-directory: release-assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          sha256sum --check SHA256SUMS
          gh release upload --clobber -- "$RELEASE_TAG" ./*.hap SHA256SUMS
